<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Revisión de sprites importados</title>
  <style>
    :root{color-scheme:dark;--bg:#0d1017;--panel:#171c28;--line:#2c3447;--text:#eef2ff;--muted:#9da8bd;--bad:#ff5f68;--ok:#58d68d}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}
    header{position:sticky;top:0;z-index:3;padding:16px 20px;background:#111621ee;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
    h1{font-size:20px;margin:0 0 10px}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    input,select{background:#0c1018;color:var(--text);border:1px solid var(--line);padding:8px 10px;border-radius:7px}
    #summary{color:var(--muted)}main{padding:18px;display:grid;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:hidden}
    .card.low{border-color:var(--bad);box-shadow:0 0 0 1px #ff5f6833}.head{display:flex;justify-content:space-between;gap:15px}.head h2{font-size:16px;margin:0 0 3px}.path{color:var(--muted);font:12px ui-monospace,monospace;overflow-wrap:anywhere}.score{white-space:nowrap;color:var(--ok);font-weight:700}.low .score{color:var(--bad)}
    .animations{display:flex;gap:18px;margin-top:14px;overflow-x:auto;padding:10px 2px 6px;align-items:end}.animation{min-width:max-content;text-align:center}.animation b{display:block;margin-bottom:7px}.animation small{display:block;color:var(--muted);margin-top:6px}.sprite{image-rendering:pixelated;background-color:#252b38;background-image:linear-gradient(45deg,#303747 25%,transparent 25%),linear-gradient(-45deg,#303747 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#303747 75%),linear-gradient(-45deg,transparent 75%,#303747 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0;border:1px solid #3a4357;margin:auto;position:relative}.sprite::after{content:"";position:absolute;inset:0;background-image:var(--strip);background-repeat:no-repeat;image-rendering:pixelated;background-position:var(--x,0) 0}
    .fallback{color:#ffc66d}.empty{padding:40px;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
<header><h1>Revisión de sprites importados</h1><div class="tools">
  <input id="search" type="search" placeholder="Personaje, forma o pack…">
  <select id="quality"><option value="all">Todos</option><option value="low">Solo baja confianza</option></select>
  <span id="summary"></span>
</div></header>
<main id="app"><div class="empty">Cargando personajes/roster.js…</div></main>
<script src="../personajes/roster.js"></script>
<script>
(() => {
  const roster = window.ANIME_ROSTER || [], app = document.querySelector('#app');
  const search = document.querySelector('#search'), quality = document.querySelector('#quality'), threshold = .55;
  const escape = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  function anim(entry, name, data) {
    const url = '../' + data.src, fallback = data.fallback ? ' <span class="fallback">(fallback)</span>' : '';
    return `<div class="animation"><b>${name}${fallback}</b><div class="sprite" data-url="${escape(url)}" data-w="${data.w}" data-frames="${data.frames}" style="width:${data.w}px;height:${data.h}px;--strip:url('${escape(url)}')"></div><small>${data.frames} f · ${data.w}×${data.h} · ${data.fps} fps</small></div>`;
  }
  function render() {
    const term = search.value.trim().toLocaleLowerCase('es'), lowOnly = quality.value === 'low';
    const visible = roster.filter(item => (!lowOnly || item.quality < threshold) && (!term || `${item.character} ${item.name} ${item.packDir}`.toLocaleLowerCase('es').includes(term)));
    document.querySelector('#summary').textContent = `${visible.length}/${roster.length} formas · ${roster.filter(x=>x.quality<threshold).length} baja confianza`;
    app.innerHTML = visible.length ? visible.map(entry => `<article class="card ${entry.quality < threshold ? 'low' : ''}"><div class="head"><div><h2>${escape(entry.character)} — ${escape(entry.name)}</h2><div class="path">${escape(entry.packDir)}</div></div><div class="score">${Math.round(entry.quality*100)}%</div></div><div class="animations">${Object.entries(entry.anims).map(([name,data])=>anim(entry,name,data)).join('')}${entry.fx.map((data,i)=>anim(entry,`fx_${i+1} · ${data.kind}`,{...data,fps:10,fallback:false})).join('')}</div></article>`).join('') : '<div class="empty">No hay resultados.</div>';
  }
  let frame = 0; setInterval(() => { frame++; document.querySelectorAll('.sprite').forEach(el => { const n=+el.dataset.frames,w=+el.dataset.w; el.style.setProperty('--x', `${-(frame%n)*w}px`); }); }, 120);
  search.addEventListener('input', render); quality.addEventListener('change', render); render();
})();
</script>
</body>
</html>
